# autorestic + Jev lab configuration. No secrets here: repository keys come from
# .autorestic.env (generated by setup.sh, read automatically by autorestic) as
# AUTORESTIC_<BACKEND>_RESTIC_PASSWORD. requireKey makes autorestic fail instead of
# silently generating a key and rewriting this file.
# Hooks run in the directory of this config file (not in "from", despite the docs) and only receive AUTORESTIC_LOCATION
# (+ stats on success): the Jev triage lives in backup.sh, which captures restic's output.
version: 2

backends:
  local:
    type: local
    path: ./repos/local
    requireKey: true
  remote:
    type: rest
    path: http://127.0.0.1:8500/lab
    requireKey: true
  quota:
    type: rest
    path: http://127.0.0.1:8501/lab
    requireKey: true

locations:
  docs-local:
    from: ./data
    to: local
    hooks:
      failure:
        - 'echo "$(date -Is) failure location=$AUTORESTIC_LOCATION" >> logs/hooks.log'
      success:
        - 'echo "$(date -Is) success location=$AUTORESTIC_LOCATION snapshot=$AUTORESTIC_SNAPSHOT_ID_0 files=$AUTORESTIC_PROCESSED_FILES_0 size=$AUTORESTIC_PROCESSED_SIZE_0" >> logs/hooks.log'
  docs-remote:
    from: ./data
    to: remote
    hooks:
      failure:
        - 'echo "$(date -Is) failure location=$AUTORESTIC_LOCATION" >> logs/hooks.log'
      success:
        - 'echo "$(date -Is) success location=$AUTORESTIC_LOCATION snapshot=$AUTORESTIC_SNAPSHOT_ID_0 files=$AUTORESTIC_PROCESSED_FILES_0 size=$AUTORESTIC_PROCESSED_SIZE_0" >> logs/hooks.log'
  docs-small:
    from: ./data
    to: quota
    hooks:
      failure:
        - 'echo "$(date -Is) failure location=$AUTORESTIC_LOCATION" >> logs/hooks.log'
      success:
        - 'echo "$(date -Is) success location=$AUTORESTIC_LOCATION snapshot=$AUTORESTIC_SNAPSHOT_ID_0 files=$AUTORESTIC_PROCESSED_FILES_0 size=$AUTORESTIC_PROCESSED_SIZE_0" >> logs/hooks.log'
